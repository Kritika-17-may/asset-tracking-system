<!DOCTYPE html>
<html>

<head>

<title>Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>


<body>


<div class="container mt-5">


<h2 class="text-center">
Create Account
</h2>


<form method="POST">


<div class="mb-3">

<label>
Username
</label>

<input 
type="text"
name="username"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Password
</label>

<input 
type="password"
name="password"
class="form-control"
required>

</div>



<div class="mb-3">

<label>
Role
</label>


<select name="role" class="form-control">


<option value="Admin">
Admin
</option>


<option value="Engineer">
Engineer
</option>


<option value="Employee">
Employee
</option>


</select>

</div>



<button class="btn btn-primary">
Register
</button>


<a href="/login" class="btn btn-secondary">
Login
</a>


</form>


</div>


</body>

</html>
