<!DOCTYPE html>
<html>

<head>

<title>Login</title>


<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>


<body>


<div class="container mt-5">


<h2 class="text-center">
Asset Management Login
</h2>



<form method="POST">


<div class="mb-3">

<label>
Username
</label>


<input 
type="text"
name="username"
class="form-control"
required>


</div>



<div class="mb-3">

<label>
Password
</label>


<input 
type="password"
name="password"
class="form-control"
required>


</div>



<button class="btn btn-success">
Login
</button>


<a href="/register" class="btn btn-primary">
Create Account
</a>



</form>


</div>


</body>

</html>
