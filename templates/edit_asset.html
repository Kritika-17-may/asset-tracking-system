<!DOCTYPE html>
<html>
<head>
    <title>Edit Asset</title>
</head>
<body>

    <h2>Edit Asset</h2>

    <form method="POST">

        <label>Name:</label>
        <input type="text" name="name" value="{{ asset.name }}">

        <br><br>

        <label>Location:</label>
        <input type="text" name="location" value="{{ asset.location }}">

        <br><br>
        <br><br>

        <label>:</label>
        <input type="text" name="category" value="{{ asset.category }}">

        <br><br>

        <label>Status:</label>
        <input type="text" name="status" value="{{ asset.status }}">

        <br><br>

        <button type="submit">Update Asset</button>

    </form>

</body>
</html>
